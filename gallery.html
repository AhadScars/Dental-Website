<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Smile Gallery · Elegancia Dental Lucknow</title>
  <meta name="description" content="Smile gallery from Elegancia Dental, Implant & Maxillofacial Centre, Lucknow." />
  <link rel="icon" type="image/jpeg" href="assets/icons/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="site-header" id="siteHeader"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Smile gallery</p>
        <h1>Light, line, and a natural finish.</h1>
        <p class="lede">A small edit of recent work and the rooms where it happens.</p>
      </div>
    </section>
    <section class="section gallery">
      <div class="container">
        <div class="gallery-grid">
          <figure class="gallery-item">
            <img src="assets/images/smile-1.jpg" alt="A naturally bright smile after whitening" />
            <figcaption>Whitening</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/images/smile-2.jpg" alt="A confident restored smile" />
            <figcaption>Restorative care</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/images/smile-3.jpg" alt="A refined smile after cosmetic treatment" />
            <figcaption>Smile design</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/images/smile-4.jpg" alt="A healthy smile after alignment" />
            <figcaption>Aligners</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="assets/images/lounge.jpg" alt="The Elegancia waiting lounge" />
            <figcaption>The lounge</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="siteFooter"></footer>
  <a class="btn btn-cyan sticky-book" href="book.html">Book Appointment</a>
  <script src="js/storage.js"></script>
  <script src="js/site.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
